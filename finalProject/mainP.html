<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Guaranty Trust Bank</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />

  <style>
    body {
      background: #122233;
      font-family: Arial, sans-serif;
      color: white;
      margin: 0;
      padding: 0;
    }

    .top-bar {
      background: #16283a;
      padding: 18px 16px;
    }

    .logo-box {
      font-size: 2rem;
      font-weight: bold;
      color: #ffd400;
      letter-spacing: 1px;
    }

    .menu-btn {
      border: 2px solid #4ea1ff;
      color: #4ea1ff;
      background: transparent;
      border-radius: 8px;
      padding: 8px 16px;
      font-weight: 600;
    }

    .hero-section {
      background: #ffd400;
      color: black;
      padding: 30px 20px 40px;
    }

    .hero-title {
      font-size: 2rem;
      font-weight: 700;
      line-height: 1.2;
      margin-bottom: 12px;
    }

    .welcome-text {
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 20px;
    }

    .hero-card {
      position: relative;
      overflow: hidden;
      border-radius: 110px 20px 20px 20px;
      background: white;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    }

    .hero-card img {
      width: 100%;
      height: 420px;
      object-fit: cover;
      display: block;
    }

    .send-money-btn {
      position: absolute;
      bottom: 20px;
      left: 20px;
      right: 20px;
      border: 2px solid white;
      background: rgba(20, 30, 40, 0.45);
      color: white;
      font-size: 1.2rem;
      font-weight: 600;
      padding: 16px;
      transition: 0.3s ease;
    }

    .dashboard-section {
      padding: 30px 20px 60px;
    }

    .secure-text {
      text-align: center;
      font-size: 1.6rem;
      font-weight: 600;
      margin-bottom: 30px;
    }

    .balance-card, .profile-card, .quick-actions {
      background: #1d3145;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 22px;
      box-shadow: 0 8px 18px rgba(0,0,0,0.25);
    }

    .balance-label, .mini-label {
      color: #c8d4df;
      font-size: 0.95rem;
      margin-bottom: 8px;
    }

    .balance-amount {
      font-size: 2rem;
      font-weight: bold;
      margin: 0;
    }

    .feature-box {
      text-align: center;
      padding: 16px 8px;
    }

    .feature-icon {
      font-size: 2rem;
      margin-bottom: 10px;
      display: inline-block;
    }

    .action-btn {
      width: 100%;
      margin-bottom: 12px;
      border-radius: 10px;
      font-weight: 600;
      padding: 12px;
    }

    .side-menu {
      position: fixed;
      top: 0;
      right: -280px;
      width: 260px;
      height: 100%;
      background: #0d1824;
      color: white;
      padding: 25px 18px;
      transition: 0.3s ease;
      z-index: 9999;
      box-shadow: -8px 0 18px rgba(0,0,0,0.35);
    }

    .side-menu.show {
      right: 0;
    }

    .side-menu a {
      display: block;
      color: white;
      text-decoration: none;
      padding: 12px 0;
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }

    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.45);
      display: none;
      z-index: 9998;
    }

    .overlay.show {
      display: block;
    }
  </style>
</head>
<body>
  <div class="overlay" id="overlay"></div>

  <div class="side-menu" id="sideMenu">
    <h4>Menu</h4>
    <a href="mainP.html">Home</a>
    <a href="transaction.html">Send Money</a>
    <a href="history.html">Transaction History</a>
    
    <a href="#" id="logoutBtn">Logout</a>
  </div>

  <div class="top-bar">
    <div class="container-fluid d-flex justify-content-between align-items-center">
      <div class="logo-box">GT</div>
      <button class="menu-btn" id="menuBtn">Menu</button>
    </div>
  </div>

  <section class="hero-section">
    <div class="container">
      <h1 class="hero-title">Send money from your account directly to Love ones</h1>
      <p class="welcome-text" id="welcomeUser">Welcome </p>

      <div class="hero-card">
        <img src="https://images.unsplash.com/photo-1517841905240-472988babdf9?auto=format&fit=crop&w=1000&q=80" alt="Bank banner">
        <button class="btn send-money-btn" id="sendMoneyHeroBtn">Send money</button>
      </div>
    </div>
  </section>

  <section class="dashboard-section">
    <div class="container">
      <div class="secure-text">
        <i class="bi bi-shield-lock"></i> You've securely logged in
      </div>

      <div class="balance-card">
        <div class="balance-label">Available Balance</div>
        <h2 class="balance-amount" id="balance">$2,000.00</h2>
        <button class="btn btn-warning mt-3" id="toggleBalanceBtn">Hide Balance</button>
      </div>

      <div class="profile-card">
        <div class="mini-label">Account Holder</div>
        <h5 id="profileName">User</h5>
        <div class="mini-label mt-3">Email</div>
        <p id="profileEmail" class="mb-0">demo@email.com</p>
      </div>

      <div class="row g-3">
        <div class="col-6 col-md-3">
          <div class="feature-box">
            <div class="feature-icon"><i class="bi bi-arrow-repeat"></i></div>
            <p>Quick resend</p>
          </div>
        </div>

        <div class="col-6 col-md-3">
          <div class="feature-box">
            <div class="feature-icon"><i class="bi bi-receipt"></i></div>
            <p>Pay bills</p>
          </div>
        </div>
    
        <div class="col-6 col-md-3">
          <div class="feature-box">
            <div class="feature-icon"><i class="bi bi-credit-card"></i></div>
            <p>Prepaid Card</p>
          </div>
        </div>
      </div>

      <div class="quick-actions">
        <h5 class="mb-3">Quick Actions</h5>
        <button class="btn btn-primary action-btn" id="goTransfer">Make a Transfer</button>
        <button class="btn btn-outline-light action-btn" id="goHistory">View History</button>
      </div>
    </div>
  </section>

  <script>
    
    const menuBtn = document.getElementById("menuBtn");
    const sideMenu = document.getElementById("sideMenu");
    const overlay = document.getElementById("overlay");
    const balance = document.getElementById("balance");
    const toggleBalanceBtn = document.getElementById("toggleBalanceBtn");

    let isBalanceHidden = false;
    let currentBalance = localStorage.getItem("balance");

    if (!currentBalance) {
      currentBalance = "2000.00";
      localStorage.setItem("balance", currentBalance);
    }

    function formatMoney(amount) {
      return "$" + Number(amount).toLocaleString("en-US", {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
      });
    }

    balance.textContent = formatMoney(currentBalance);

    const userName = localStorage.getItem("loggedInUser") || "Customer";
    const userEmail = localStorage.getItem("userEmail") || "demo@email.com";

    document.getElementById("welcomeUser").textContent = "Welcome back, " + userName;
    document.getElementById("profileName").textContent = userName;
    document.getElementById("profileEmail").textContent = userEmail;

    menuBtn.addEventListener("click", function () {
      sideMenu.classList.add("show");
      overlay.classList.add("show");
    });

    overlay.addEventListener("click", function () {
      sideMenu.classList.remove("show");
      overlay.classList.remove("show");
    });

    toggleBalanceBtn.addEventListener("click", function () {
      if (isBalanceHidden) {
        balance.textContent = formatMoney(currentBalance);
        toggleBalanceBtn.textContent = "Hide Balance";
      } else {
        balance.textContent = "••••••";
        toggleBalanceBtn.textContent = "Show Balance";
      }
      isBalanceHidden = !isBalanceHidden;
    });

    document.getElementById("sendMoneyHeroBtn").addEventListener("click", function () {
      window.location.href = "transaction.html";
    });

    document.getElementById("goTransfer").addEventListener("click", function () {
      window.location.href = "transaction.html";
    });

    document.getElementById("goHistory").addEventListener("click", function () {
      window.location.href = "history.html";
    });
      
    document.getElementById("logoutBtn").addEventListener("click", function (e) {
      e.preventDefault();
      localStorage.removeItem("loggedInUser");
      localStorage.removeItem("userEmail");
      alert("You have been logged out.");
      window.location.href = "index1.html";
    });
  </script>
</body>
</html>

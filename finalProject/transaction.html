<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Send Money</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />

  <style>
    body {
      background: #122233;
      color: white;
      font-family: Arial, sans-serif;
    }

    .top-bar {
      background: #16283a;
      padding: 18px 16px;
    }

    .logo-box {
      font-size: 2rem;
      font-weight: bold;
      color: #ffd400;
    }

    .menu-btn {
      border: 2px solid #4ea1ff;
      color: #4ea1ff;
      background: transparent;
      border-radius: 8px;
      padding: 8px 16px;
      font-weight: 600;
    }

    .page-section {
      padding: 30px 20px 60px;
    }

    .page-title {
      font-size: 2rem;
      font-weight: 700;
      margin-bottom: 20px;
    }

    .card-box {
      background: #1d3145;
      border-radius: 16px;
      padding: 22px;
      box-shadow: 0 8px 18px rgba(0,0,0,0.25);
    }

    .form-label {
      font-weight: 600;
      margin-top: 10px;
    }

    .form-control, .form-select {
      border-radius: 10px;
      padding: 12px;
    }

    .balance-text, .rate-text {
      color: #cbd5df;
      margin-bottom: 12px;
    }

    .submit-btn {
      width: 100%;
      padding: 14px;
      font-weight: 700;
      border-radius: 10px;
      margin-top: 18px;
    }

    .back-link {
      color: #ffd400;
      text-decoration: none;
      display: inline-block;
      margin-bottom: 20px;
    }

    .result-box {
      margin-top: 15px;
      background: #274058;
      border-radius: 12px;
      padding: 14px;
    }

    .side-menu {
      position: fixed;
      top: 0;
      right: -280px;
      width: 260px;
      height: 100%;
      background: #0d1824;
      color: white;
      padding: 25px 18px;
      transition: 0.3s ease;
      z-index: 9999;
      box-shadow: -8px 0 18px rgba(0,0,0,0.35);
    }

    .side-menu.show {
      right: 0;
    }

    .side-menu a {
      display: block;
      color: white;
      text-decoration: none;
      padding: 12px 0;
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }

    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.45);
      display: none;
      z-index: 9998;
    }

    .overlay.show {
      display: block;
    }
  </style>
</head>
<body>
  <div class="overlay" id="overlay"></div>

  <div class="side-menu" id="sideMenu">
    <h4>Menu</h4>
    <a href="mainP.html">Home</a>
    <a href="transaction.html">Send Money</a>
    <a href="history.html">Transaction History</a>
    
  </div>

  <div class="top-bar">
    <div class="container-fluid d-flex justify-content-between align-items-center">
      <div class="logo-box">GT</div>
      <button class="menu-btn" id="menuBtn">Menu</button>
    </div>
  </div>

  <section class="page-section">
    <div class="container">
      <a href="mainP.html" class="back-link"><i class="bi bi-arrow-left"></i> Back to Home</a>
      <h1 class="page-title">Send Money</h1>

      <div class="card-box">
        <p class="balance-text">Available Balance: <strong id="currentBalance">$2,000.00</strong></p>

        <form id="transferForm">
          <label class="form-label">Recipient Name</label>
          <input type="text" id="recipientName" class="form-control" placeholder="Enter recipient name" required />

          <label class="form-label">Bank Name</label>
          <input type="text" id="bankName" class="form-control" placeholder="Enter bank name" required />

          <label class="form-label">Account Number</label>
          <input type="text" id="accountNumber" class="form-control" placeholder="Enter account number" required />

          <label class="form-label">From Currency</label>
          <select id="fromCurrency" class="form-select" required></select>

          <label class="form-label">To Currency</label>
          <select id="toCurrency" class="form-select" required></select>

          <label class="form-label">Amount</label>
          <input type="number" id="amount" class="form-control" placeholder="Enter amount" min="1" required />

          <div class="result-box">
            <p class="rate-text mb-2">Live Conversion</p>
            <p class="mb-1"><strong>Converted Amount:</strong> <span id="convertedAmount">--</span></p>
            <p class="mb-0"><strong>Rate:</strong> <span id="exchangeRate">--</span></p>
          </div>

          <button type="submit" class="btn btn-warning submit-btn">Send Money</button>
        </form>
      </div>
    </div>
  </section>

  <script>
    const menuBtn = document.getElementById("menuBtn");
    const sideMenu = document.getElementById("sideMenu");
    const overlay = document.getElementById("overlay");

    menuBtn.addEventListener("click", function () {
      sideMenu.classList.add("show");
      overlay.classList.add("show");
    });

    overlay.addEventListener("click", function () {
      sideMenu.classList.remove("show");
      overlay.classList.remove("show");
    });

    function formatMoney(amount) {
      return "$" + Number(amount).toLocaleString("en-US", {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
      });
    }

    let balance = Number(localStorage.getItem("balance")) || 2000;
    document.getElementById("currentBalance").textContent = formatMoney(balance);

    const fromCurrency = document.getElementById("fromCurrency");
    const toCurrency = document.getElementById("toCurrency");
    const amountInput = document.getElementById("amount");
    const convertedAmount = document.getElementById("convertedAmount");
    const exchangeRate = document.getElementById("exchangeRate");
    const transferForm = document.getElementById("transferForm");

    async function loadCurrencies() {
      try {
        const response = await fetch("https://api.frankfurter.dev/v1/currencies");
        const data = await response.json();

        for (let code in data) {
          const option1 = new Option(code + " - " + data[code], code);
          const option2 = new Option(code + " - " + data[code], code);
          fromCurrency.add(option1);
          toCurrency.add(option2);
        }

        fromCurrency.value = "USD";
        toCurrency.value = "EUR";
        convertMoney();
      } catch (error) {
        alert("Unable to load currencies from API.");
      }
    }

    async function convertMoney() {
      const amount = amountInput.value;
      const from = fromCurrency.value;
      const to = toCurrency.value;

      if (!amount || !from || !to) {
        convertedAmount.textContent = "--";
        exchangeRate.textContent = "--";
        return;
      }

      if (from === to) {
        convertedAmount.textContent = Number(amount).toFixed(2) + " " + to;
        exchangeRate.textContent = "1 " + from + " = 1 " + to;
        return;
      }

      try {
        const response = await fetch(`https://api.frankfurter.dev/v1/latest?amount=${amount}&base=${from}&symbols=${to}`);
        const data = await response.json();

        const convertedValue = data.rates[to];
        convertedAmount.textContent = convertedValue.toFixed(2) + " " + to;

        const rateResponse = await fetch(`https://api.frankfurter.dev/v1/latest?base=${from}&symbols=${to}`);
        const rateData = await rateResponse.json();
        exchangeRate.textContent = "1 " + from + " = " + rateData.rates[to].toFixed(4) + " " + to;
      } catch (error) {
        convertedAmount.textContent = "Error";
        exchangeRate.textContent = "Unable to fetch rate";
      }
    }

    amountInput.addEventListener("input", convertMoney);
    fromCurrency.addEventListener("change", convertMoney);
    toCurrency.addEventListener("change", convertMoney);

    transferForm.addEventListener("submit", function (e) {
      e.preventDefault();

      const recipientName = document.getElementById("recipientName").value.trim();
      const bankName = document.getElementById("bankName").value.trim();
      const accountNumber = document.getElementById("accountNumber").value.trim();
      const amount = Number(document.getElementById("amount").value);
      const from = fromCurrency.value;
      const to = toCurrency.value;
      const convertedText = convertedAmount.textContent;

      if (!recipientName || !bankName || !accountNumber || !amount || !from || !to) {
        alert("Please fill in all fields.");
        return;
      }

      if (amount <= 0) {
        alert("Enter a valid amount.");
        return;
      }

      if (amount > balance) {
        alert("Insufficient balance.");
        return;
      }

      balance = balance - amount;
      localStorage.setItem("balance", balance.toFixed(2));

      const transactions = JSON.parse(localStorage.getItem("transactions")) || [];

      const newTransaction = {
        id: "TRX" + Date.now(),
        recipientName: recipientName,
        bankName: bankName,
        accountNumber: accountNumber,
        amount: amount.toFixed(2),
        fromCurrency: from,
        toCurrency: to,
        convertedAmount: convertedText,
        rate: exchangeRate.textContent,
        status: "Processing",
        date: new Date().toLocaleString()
      };

      transactions.unshift(newTransaction);
      localStorage.setItem("transactions", JSON.stringify(transactions));
      localStorage.setItem("lastTransferId", newTransaction.id);

      alert("Transfer submitted successfully.");
      window.location.href = "history.html";
    });

    loadCurrencies();
  </script>
</body>
</html>

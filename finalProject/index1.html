<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GT Bank </title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    body {
      background: linear-gradient(135deg, #122233, #1f3550);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
    }

    .login-card {
      width: 100%;
      max-width: 420px;
      background: white;
      border-radius: 18px;
      padding: 30px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.25);
    }

    .brand {
      font-size: 2.2rem;
      font-weight: bold;
      color: #ffd400;
      text-align: center;
      margin-bottom: 10px;
    }

    .title {
      text-align: center;
      font-weight: 700;
      margin-bottom: 22px;
      color: #122233;
    }

    .form-control {
      padding: 12px;
      border-radius: 10px;
    }

    .login-btn {
      width: 100%;
      padding: 12px;
      font-weight: 700;
      border-radius: 10px;
      margin-top: 10px;
    }

    .small-text {
      text-align: center;
      margin-top: 14px;
      color: #666;
      font-size: 0.95rem;
    }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="brand">GT</div>
    <h2 class="title">Welcome Back</h2>

    <form id="loginForm">
      <div class="mb-3">
        <label class="form-label">Full name</label>
        <input type="text" id="fullName" class="form-control" placeholder="@examplbrown" required />
      </div>
    
      <div class="mb-3">
        <label class="form-label">User ID</label>
        <input type="email" id="email" class="form-control" placeholder="example@gmail.com" required />
      </div>

      <div class="mb-3">
        <label class="form-label">Password</label>
        <input type="password" id="password" class="form-control" placeholder="password" required />
      </div>

      <button type="submit" class="btn btn-warning login-btn">Login</button>
    </form>

  </div>

  <script>
    const loginForm = document.getElementById("loginForm");

    loginForm.addEventListener("submit", function (e) {
      e.preventDefault();

      const fullName = document.getElementById("fullName").value.trim();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value.trim();

      if (!fullName || !email || !password) {
        alert("Please fill in all fields.");
        return;
      }

      localStorage.setItem("loggedInUser", fullName);
      localStorage.setItem("userEmail", email);

      if (!localStorage.getItem("balance")) {
        localStorage.setItem("balance", "2000.00");
      }

      window.location.href = "mainP.html";
    });
  </script>
</body>
</html>
